<!DOCTYPE html>
<html>
<head>
    <title>View Menu</title>
</head>
<body>
<h1>Menu</h1>
<table>
    <tr>
        <th>Item Name</th>
        <th>Price</th>
    </tr>
    {% for item in menu_items %}
    <tr>
        <td>{{ item[0] }}</td>
        <td>${{ item[1] }}</td>
    </tr>
    {% endfor %}
</table>
<br>
<a href="/order" class="button">Order</a><br><br>
<a href="/view_orders" class="button">View your orders</a>
</body>
</html>
