<!DOCTYPE html>
<html>
<head>
    <title>View Orders</title>
</head>
<body>
<h1>View Orders</h1>

<table>
    <tr>
        <th>Order ID</th>
        <th>Item Name</th>
        <th>Quantity</th>
        <th>Total Price</th>
    </tr>
    {% for order in orders %}
    <tr>
        <td>{{ order[0] }}</td>
        <td>{{ order[1] }}</td>
        <td>{{ order[2] }}</td>
        <td>{{ "%.2f" % order[3] }}</td>
    </tr>
    {% endfor %}
</table>

<p>Total Price: ${{ "%.2f" % total_price }}</p><br>
<a href="/order" class="button">Order</a><br><br>
<a href="/menu" class="button">See the Menu</a>
</body>
</html>
